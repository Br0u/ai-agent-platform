x-dev-proxy: &dev-proxy
  image: ${WEB_RUNTIME_IMAGE:-ai-agent-platform-web}
  restart: unless-stopped
  entrypoint: ["node"]
  command:
    - -e
    - >-
      const net=require("node:net");
      const port=Number(process.env.PROXY_PORT);
      const server=net.createServer(client=>{
        const upstream=net.connect(Number(process.env.UPSTREAM_PORT),process.env.UPSTREAM_HOST);
        client.pipe(upstream);upstream.pipe(client);
        const close=()=>{client.destroy();upstream.destroy()};
        client.on("error",close);upstream.on("error",close)
      });
      server.listen(port,"0.0.0.0")
  networks:
    - default
    - backend
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - >-
        const net=require("node:net");
        const socket=net.connect(Number(process.env.UPSTREAM_PORT),process.env.UPSTREAM_HOST,()=>{
          socket.end();process.exit(0)
        });
        socket.on("error",()=>process.exit(1))
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 5s
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  agent-dev-proxy:
    <<: *dev-proxy
    environment:
      PROXY_PORT: "7777"
      UPSTREAM_HOST: agent
      UPSTREAM_PORT: "7777"
    ports:
      - "127.0.0.1:${AGENTOS_DEV_PORT:-7777}:7777"

  skill-registry-dev-proxy:
    <<: *dev-proxy
    environment:
      PROXY_PORT: "7788"
      UPSTREAM_HOST: skill-registry
      UPSTREAM_PORT: "7788"
    ports:
      - "127.0.0.1:${SKILL_REGISTRY_DEV_PORT:-7788}:7788"

networks:
  default: {}
  backend:
    external: true
    name: ${AAP_DOCKER_BACKEND_NETWORK:-ai-agent-platform_backend}
